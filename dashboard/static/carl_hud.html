<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARL — AI Operating System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

:root {
  --cyan: #3ec6ff;
  --cyan-bright: #7fe8ff;
  --cyan-dim: #1a6b8a;
  --cyan-glow: rgba(62, 198, 255, 0.4);
  --cyan-glow-strong: rgba(62, 198, 255, 0.7);
  --white: #c9d3da;
  --white-bright: #e8f2ff;
  --navy: #0a0e1a;
  --navy-light: #111828;
  --surface: rgba(10, 14, 26, 0.85);
  --ring-width: 2px;
  --transition-speed: 500ms;
  --font-tech: 'Orbitron', sans-serif;
  --font-data: 'Share Tech Mono', monospace;
  --font-label: 'Rajdhani', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: var(--navy);
  overflow: hidden;
  font-family: var(--font-data);
  color: var(--white);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 30% 40%, rgba(12,20,50,0.6) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 60%, rgba(30,10,30,0.4) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 50%, rgba(5,8,20,1) 0%, #000 100%);
  z-index: -1;
}

#carl-hud {
  position: relative;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ═══ CORE ORB ═══ */
.core-container {
  position: absolute;
  width: 140px; height: 140px;
  display: flex; align-items: center; justify-content: center;
}

.core-orb {
  width: 90px; height: 90px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--cyan-bright) 0%, var(--cyan) 40%, transparent 70%);
  box-shadow: 0 0 40px var(--cyan-glow), 0 0 80px var(--cyan-glow),
              inset 0 0 20px rgba(127,232,255,0.3);
  transition: all var(--transition-speed) ease;
  animation: corePulse 3.5s ease-in-out infinite;
}

.state-listening .core-orb {
  width: 80px; height: 80px;
  box-shadow: 0 0 30px var(--cyan-glow-strong), 0 0 60px var(--cyan-glow-strong),
              inset 0 0 25px rgba(127,232,255,0.5);
  animation: coreAlert 1.5s ease-in-out infinite;
}

.state-answering .core-orb {
  width: 100px; height: 100px;
  box-shadow: 0 0 50px var(--cyan-glow-strong), 0 0 100px var(--cyan-glow),
              inset 0 0 30px rgba(127,232,255,0.4);
  animation: coreBreathe 2.5s ease-in-out infinite;
}

@keyframes corePulse {
  0%, 100% { transform: scale(0.98); opacity: 0.85; }
  50% { transform: scale(1.02); opacity: 1; }
}
@keyframes coreAlert {
  0%, 100% { transform: scale(0.96); }
  50% { transform: scale(1.0); }
}
@keyframes coreBreathe {
  0%, 100% { transform: scale(1.0); }
  50% { transform: scale(1.06); }
}

.core-text {
  position: absolute;
  font-family: var(--font-tech);
  font-size: 11px;
  font-weight: 700;
  color: var(--white-bright);
  letter-spacing: 3px;
  text-shadow: 0 0 10px var(--cyan-glow);
  text-transform: uppercase;
}


/* ═══ SVG RINGS ═══ */
.rings-svg {
  position: absolute;
  width: 700px; height: 700px;
  max-width: 90vmin; max-height: 90vmin;
}

.ring-inner { animation: ringRotateSlow 60s linear infinite; }
.ring-middle { animation: ringRotateSlow 90s linear infinite reverse; }
.ring-outer { animation: ringRotateSlow 120s linear infinite; }

.state-listening .ring-inner { animation-duration: 8s; }
.state-listening .ring-middle { animation-duration: 20s; }
.state-answering .ring-inner { animation-duration: 30s; }
.state-answering .ring-middle { animation-duration: 45s; }

@keyframes ringRotateSlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Tick marks */
.tick-bar {
  fill: var(--cyan);
  opacity: 0.5;
  transition: opacity 120ms, height 120ms;
}
.state-listening .tick-bar {
  opacity: 1;
}
.state-answering .tick-bar {
  opacity: 0.7;
}

/* Middle ring segments */
.ring-segment {
  fill: none;
  stroke: var(--cyan-dim);
  stroke-width: 1.5;
  opacity: 0.6;
  transition: stroke var(--transition-speed), opacity var(--transition-speed);
}
.state-listening .ring-segment { stroke: var(--cyan); opacity: 0.9; }
.state-answering .ring-segment { stroke: var(--cyan-bright); opacity: 0.8; }

/* Outer nav arcs */
.nav-arc {
  fill: none;
  stroke: var(--cyan-dim);
  stroke-width: 2.5;
  cursor: pointer;
  transition: stroke 300ms, filter 300ms;
  filter: drop-shadow(0 0 3px rgba(62,198,255,0.2));
}
.nav-arc:hover {
  stroke: var(--cyan-bright);
  filter: drop-shadow(0 0 8px var(--cyan-glow-strong));
}
.nav-label {
  font-family: var(--font-tech);
  font-size: 8px;
  font-weight: 500;
  fill: var(--white);
  letter-spacing: 2px;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

/* Sonar ping */
.sonar-ping {
  position: absolute;
  width: 90px; height: 90px;
  border-radius: 50%;
  border: 1px solid var(--cyan);
  opacity: 0;
  pointer-events: none;
}
.state-answering .sonar-ping {
  animation: sonarPing 3s ease-out infinite;
}
@keyframes sonarPing {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(4); opacity: 0; }
}

/* ═══ SIDE PANELS ═══ */
.panel {
  position: absolute;
  background: var(--surface);
  border: 1px solid rgba(62,198,255,0.12);
  border-radius: 8px;
  padding: 12px 16px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 15px rgba(62,198,255,0.05);
}
.panel-title {
  font-family: var(--font-tech);
  font-size: 8px;
  font-weight: 500;
  color: var(--cyan);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.panel-value {
  font-family: var(--font-data);
  font-size: 13px;
  color: var(--white-bright);
}
.panel-sub {
  font-family: var(--font-label);
  font-size: 11px;
  color: var(--white);
  opacity: 0.6;
}

.panel-top-left { top: 24px; left: 24px; }
.panel-top-right { top: 24px; right: 24px; }
.panel-left { left: 24px; top: 50%; transform: translateY(-50%); }
.panel-right { right: 24px; top: 50%; transform: translateY(-50%); }
.panel-bottom-left { bottom: 24px; left: 24px; }
.panel-bottom-right { bottom: 24px; right: 24px; }

/* Connector lines */
.connector {
  position: absolute;
  background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
  height: 1px;
  opacity: 0.3;
}

/* ═══ RESPONSIVE ═══ */
@media (max-width: 900px) {
  .panel-left, .panel-right { display: none; }
  .rings-svg { max-width: 80vmin; max-height: 80vmin; }
}
@media (max-width: 600px) {
  .panel-top-left, .panel-top-right,
  .panel-bottom-left, .panel-bottom-right { display: none; }
}
</style>
</head>

<body>
<div id="carl-hud" class="state-idle">

  <!-- SVG Rings -->
  <svg class="rings-svg" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
    <!-- Inner tick ring -->
    <g class="ring-inner" id="tick-ring"></g>
    <!-- Middle segmented ring -->
    <g class="ring-middle" id="mid-ring"></g>
    <!-- Outer nav ring -->
    <g class="ring-outer" id="nav-ring"></g>
  </svg>

  <!-- Core -->
  <div class="core-container">
    <div class="core-orb"></div>
    <span class="core-text" id="core-label">CARL</span>
    <div class="sonar-ping"></div>
  </div>

  <!-- Panels -->
  <div class="panel panel-top-left">
    <div class="panel-title">TIME</div>
    <div class="panel-value" id="p-time">--:--:--</div>
    <div class="panel-sub" id="p-date">--- -- ----</div>
  </div>

  <div class="panel panel-top-right">
    <div class="panel-title">STATUS</div>
    <div class="panel-value" id="p-status">IDLE</div>
    <div class="panel-sub">AI CORE ACTIVE</div>
  </div>

  <div class="panel panel-left">
    <div class="panel-title">SYSTEM</div>
    <div class="panel-sub">CPU <span id="p-cpu">--</span>%</div>
    <div class="panel-sub">MEM <span id="p-mem">--</span>%</div>
    <div class="panel-sub">DISK <span id="p-disk">--</span>%</div>
  </div>

  <div class="panel panel-right">
    <div class="panel-title">ENVIRON</div>
    <div class="panel-sub" id="p-location">Location: --</div>
    <div class="panel-sub" id="p-weather">Weather: --</div>
    <div class="panel-sub" id="p-temp">Temp: --</div>
  </div>

  <div class="panel panel-bottom-left">
    <div class="panel-title">MODE</div>
    <div class="panel-value" id="p-mode">STANDBY</div>
  </div>

  <div class="panel panel-bottom-right">
    <div class="panel-title">POWER</div>
    <div class="panel-value" id="p-power">100%</div>
    <div style="display:flex;gap:2px;margin-top:4px;">
      <div class="pwr-seg active"></div>
      <div class="pwr-seg active"></div>
      <div class="pwr-seg active"></div>
      <div class="pwr-seg active"></div>
      <div class="pwr-seg active"></div>
    </div>
  </div>

</div>

<style>
.pwr-seg {
  width: 14px; height: 6px;
  border: 1px solid var(--cyan-dim);
  border-radius: 1px;
}
.pwr-seg.active {
  background: var(--cyan);
  box-shadow: 0 0 4px var(--cyan-glow);
}
</style>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CARL HUD — Controller
// ══════════════════════════════════════════════════════════════════════════════

const CarlHUD = (() => {
  const hud = document.getElementById('carl-hud');
  const cx = 350, cy = 350;
  let state = 'idle';
  let tickBars = [];
  let animFrame = null;

  // ── Build SVG rings ─────────────────────────────────────────────────────

  function buildTickRing() {
    const g = document.getElementById('tick-ring');
    const count = 72;
    const r = 95;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * 360;
      const rad = angle * Math.PI / 180;
      const x = cx + Math.cos(rad) * r;
      const y = cy + Math.sin(rad) * r;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('class', 'tick-bar');
      rect.setAttribute('x', x - 1);
      rect.setAttribute('y', y - 4);
      rect.setAttribute('width', 2);
      rect.setAttribute('height', 8);
      rect.setAttribute('transform', `rotate(${angle}, ${x}, ${y})`);
      g.appendChild(rect);
      tickBars.push(rect);
    }
  }

  function buildMidRing() {
    const g = document.getElementById('mid-ring');
    const r = 160;
    const segments = 36;
    const gap = 2;
    const arcLen = (360 / segments) - gap;
    for (let i = 0; i < segments; i++) {
      const start = i * (360 / segments);
      const end = start + arcLen;
      const path = describeArc(cx, cy, r, start, end);
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      el.setAttribute('d', path);
      el.setAttribute('class', 'ring-segment');
      g.appendChild(el);
    }
    // Percentage markers
    for (let i = 0; i <= 10; i++) {
      const angle = (i / 10) * 360 - 90;
      const rad = angle * Math.PI / 180;
      const tx = cx + Math.cos(rad) * (r + 14);
      const ty = cy + Math.sin(rad) * (r + 14);
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', tx);
      text.setAttribute('y', ty);
      text.setAttribute('class', 'nav-label');
      text.setAttribute('font-size', '6');
      text.setAttribute('fill', 'rgba(201,211,218,0.4)');
      text.textContent = (i * 10) + '';
      g.appendChild(text);
    }
  }

  function buildNavRing() {
    const g = document.getElementById('nav-ring');
    const r = 260;
    const items = ['CTRL', 'DOCS', 'AI MODE', 'XPLR', 'DESK', 'GAME', 'CFG'];
    const arcPer = 360 / items.length;
    const gap = 6;
    items.forEach((label, i) => {
      const start = i * arcPer + gap / 2;
      const end = start + arcPer - gap;
      const path = describeArc(cx, cy, r, start, end);
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      el.setAttribute('d', path);
      el.setAttribute('class', 'nav-arc');
      el.setAttribute('data-nav', label);
      g.appendChild(el);
      // Label
      const midAngle = ((start + end) / 2 - 90) * Math.PI / 180;
      const lx = cx + Math.cos(midAngle) * (r + 1);
      const ly = cy + Math.sin(midAngle) * (r + 1);
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', lx);
      text.setAttribute('y', ly);
      text.setAttribute('class', 'nav-label');
      text.textContent = label;
      g.appendChild(text);
    });
  }

  // ── SVG arc helper ──────────────────────────────────────────────────────

  function describeArc(cx, cy, r, startAngle, endAngle) {
    const s = (startAngle - 90) * Math.PI / 180;
    const e = (endAngle - 90) * Math.PI / 180;
    const x1 = cx + r * Math.cos(s);
    const y1 = cy + r * Math.sin(s);
    const x2 = cx + r * Math.cos(e);
    const y2 = cy + r * Math.sin(e);
    const large = (endAngle - startAngle) > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
  }

  // ── Animation loop ────────────────────────────────────────────────────────

  let lastFlicker = 0;
  let waveOffset = 0;

  function animate(ts) {
    animFrame = requestAnimationFrame(animate);

    if (state === 'listening') {
      // Chaotic flicker on tick bars — simulates audio input
      if (ts - lastFlicker > 90) {
        lastFlicker = ts;
        tickBars.forEach(bar => {
          const h = 4 + Math.random() * 14;
          const o = 0.4 + Math.random() * 0.6;
          bar.setAttribute('height', h);
          bar.setAttribute('y', parseFloat(bar.getAttribute('y')) + (8 - h) * 0.1);
          bar.style.opacity = o;
        });
      }
    } else if (state === 'answering') {
      // Smooth sine wave ripple
      waveOffset += 0.015;
      tickBars.forEach((bar, i) => {
        const phase = (i / tickBars.length) * Math.PI * 2 + waveOffset;
        const h = 6 + Math.sin(phase) * 5;
        const o = 0.5 + Math.sin(phase) * 0.3;
        bar.setAttribute('height', h);
        bar.style.opacity = Math.max(0.3, o);
      });
    } else {
      // Idle — subtle uniform breathing
      const breath = Math.sin(ts * 0.001) * 0.15 + 0.5;
      tickBars.forEach(bar => {
        bar.setAttribute('height', 8);
        bar.style.opacity = breath;
      });
    }
  }

  // ── Live data ─────────────────────────────────────────────────────────────

  function updateClock() {
    const now = new Date();
    document.getElementById('p-time').textContent =
      now.toLocaleTimeString('en-GB', { hour12: false });
    document.getElementById('p-date').textContent =
      now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  // ── Public API ────────────────────────────────────────────────────────────

  function setState(newState) {
    state = newState;
    hud.className = `state-${state}`;
    document.getElementById('p-status').textContent = state.toUpperCase();
    document.getElementById('core-label').textContent =
      state === 'idle' ? 'CARL' : state === 'listening' ? 'LISTEN' : 'THINK';
  }

  function setData(key, value) {
    const el = document.getElementById(`p-${key}`);
    if (el) el.textContent = value;
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  function init() {
    buildTickRing();
    buildMidRing();
    buildNavRing();
    animFrame = requestAnimationFrame(animate);
    setInterval(updateClock, 1000);
    updateClock();
  }

  init();

  return { setState, setData };
})();

// ── Demo: cycle states every 6 seconds for preview ──────────────────────────
let demoIdx = 0;
const demoStates = ['idle', 'listening', 'answering'];
setInterval(() => {
  demoIdx = (demoIdx + 1) % demoStates.length;
  CarlHUD.setState(demoStates[demoIdx]);
}, 6000);
</script>
</body>
</html>
